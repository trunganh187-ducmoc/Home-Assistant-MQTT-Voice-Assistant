name: Build ESP32-P4 Firmware

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure Silicon Revision for ESP32-P4 ECO2 (Rev 1.0)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          # 1. Xóa các cờ revision cũ trong sdkconfig để tránh xung đột
          sed -i '/CONFIG_ESP32P4_REV_/d' sdkconfig
          sed -i '/CONFIG_ESP32P4_SELECTS_REV_/d' sdkconfig
          
          # 2. Khóa cứng cấu hình phần cứng cho chip esp32p4-eco2 (Rev 1.0)
          echo "CONFIG_ESP32P4_SELECTS_REV_LESS_V3=y" >> sdkconfig
          echo "CONFIG_ESP32P4_REV_MIN_100=y" >> sdkconfig
          echo "CONFIG_ESP32P4_REV_MIN_FULL=100" >> sdkconfig
          
          # 3. Đồng bộ lại sdkconfig mà vẫn bảo toàn 100% cấu hình 105KB gốc của dự án
          idf.py reconfigure

      - name: Build Firmware (Linux Native IDF)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          # Dùng idf.py build thay cho build.py để không bị lỗi gọi cmd.exe trên Linux
          idf.py build

      - name: Merge All 5 Partitions into Single Binary
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd build
          esptool.py --chip esp32p4 merge_bin -o merged_firmware_0x0.bin @flash_args
          ls -lh merged_firmware_0x0.bin

      - name: Upload All Binary Artifacts (Full Set)
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-P4-Voice-Assistant-Binaries
          path: |
            build/merged_firmware_0x0.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/esp32_p4_voice_assistant.bin
            build/srmodels/srmodels.bin
            build/flasher_args.json
